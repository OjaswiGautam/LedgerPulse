services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ledgerpulse
      POSTGRES_USER: ledgerpulse
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    volumes:
      - ../data/mlflow:/mlflow

  api:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    command: uvicorn ledgerpulse.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ../data:/data
    depends_on:
      - postgres
      - mlflow

  worker-stream:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    command: python -m ledgerpulse.workers.stream
    volumes:
      - ../data:/data
    depends_on:
      - postgres

  worker-ml:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    command: python -m ledgerpulse.workers.ml
    volumes:
      - ../data:/data
    depends_on:
      - postgres
      - mlflow

  worker-report:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    command: python -m ledgerpulse.workers.report
    volumes:
      - ../data:/data
    depends_on:
      - postgres

  worker-bench:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    command: python -m ledgerpulse.workers.bench
    volumes:
      - ../data:/data
    depends_on:
      - postgres
      - mlflow

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - api
