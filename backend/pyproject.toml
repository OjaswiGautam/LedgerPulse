[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerpulse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "duckdb>=1.0",
    "polars>=1.0",
    "pandas>=2.2",
    "pandera>=0.20",
    "lightgbm>=4.4",
    "river>=0.21",
    "shap>=0.45",
    "mlflow>=2.14",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "python-ulid>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "schemathesis>=3.30",
]

[tool.importlinter]
root_package = "ledgerpulse"

[[tool.importlinter.contracts]]
name = "Strict L0-L5 layered architecture"
type = "layers"
layers = [
    "ledgerpulse.api | ledgerpulse.workers | ledgerpulse.cli",
    "ledgerpulse.governance | ledgerpulse.hitl | ledgerpulse.reporting | ledgerpulse.benchmark",
    "ledgerpulse.models | ledgerpulse.monitoring | ledgerpulse.explain",
    "ledgerpulse.datasets | ledgerpulse.simulator | ledgerpulse.replay | ledgerpulse.ingestion | ledgerpulse.features",
    "ledgerpulse.storage",
    "ledgerpulse.core",
]
